<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0284C7" />
  <title>AURA HEALTH AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0B3B60;
      --blue: #0284C7;
      --sky: #38BDF8;
      --teal: #0D9488;
      --mint: #14B8A6;
      --bg: #F4F9FD;
      --card: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2EEF7;
      --shadow-soft: 0 10px 28px -10px rgba(2, 132, 199, 0.18);
      --shadow-card: 0 4px 18px -4px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #E0F2FE 0%, #F1F5F9 50%, #CCFBF1 100%);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior-y: contain;
    }

    .app-wrapper {
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .phone-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    @media (min-width: 520px) {
      .app-wrapper { padding: 20px 0; }
      .phone-shell {
        min-height: 840px;
        max-height: 890px;
        border-radius: 36px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 25px 60px -15px rgba(11, 59, 96, 0.22);
        overflow: hidden;
      }
    }

    /* Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #E0F2FE;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284C7, #14B8A6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #0B3B60, #0284C7, #0D9488);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .back-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #F0F9FF;
      border: 1px solid #BAE6FD;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0369A1;
    }

    .header-pill {
      padding: 7px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #F0F9FF, #F0FDFA);
      border: 1px solid #99F6E4;
      color: #0F766E;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Main Content */
    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 96px;
    }

    .main-scroll::-webkit-scrollbar { display: none; }

    .screen-anim {
      animation: fadeUp 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pulseAura {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }

    .anim-float { animation: floatSlow 4.5s ease-in-out infinite; }
    .anim-aura { animation: pulseAura 4s ease-in-out infinite; transform-origin: center; }

    /* Cards & Helpers */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      margin-bottom: 14px;
    }

    .hero-card {
      padding: 14px;
      box-shadow: var(--shadow-soft);
      border-color: #BAE6FD;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #F0FDFA;
      border: 1px solid #CCFBF1;
      color: #0F766E;
      font-size: 11px;
      font-weight: 700;
    }

    .h-title {
      margin: 10px 0 4px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #0F172A;
    }

    .sub-text {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--muted);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 4px 10px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: #1E293B;
    }

    .section-head span {
      font-size: 11px;
      font-weight: 700;
      color: var(--teal);
    }

    /* Prominent Routine Cards */
    .routine-card-morning {
      width: 100%;
      border: none;
      text-align: left;
      border-radius: 24px;
      padding: 16px;
      background: linear-gradient(135deg, #0284C7 0%, #0EA5E9 55%, #0D9488 100%);
      color: #FFFFFF;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.15s;
    }

    .routine-card-afternoon {
      width: 100%;
      text-align: left;
      border-radius: 24px;
      padding: 16px;
      background: linear-gradient(135deg, #FFFFFF 0%, #F0FDFA 100%);
      border: 1px solid #99F6E4;
      color: #0F172A;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      margin-bottom: 14px;
      transition: transform 0.15s;
    }

    .pressable:active { transform: scale(0.98); }

    .mini-illus-box {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      padding: 6px;
      flex-shrink: 0;
    }

    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
      flex: 1;
    }

    .progress-track-light {
      background: #CCFBF1;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: #FFFFFF;
      transition: width 0.4s ease;
    }

    .progress-fill-teal {
      background: linear-gradient(90deg, #0284C7, #0D9488);
    }

    /* Feature Grid */
    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .feature-card {
      border-radius: 22px;
      padding: 14px;
      text-align: left;
      border: 1px solid #E0F2FE;
      background: linear-gradient(155deg, #FFFFFF 0%, #F0F9FF 100%);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 122px;
      transition: transform 0.15s;
    }

    .feature-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Buttons & Inputs */
    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 13px 16px;
      background: linear-gradient(90deg, #0284C7, #0D9488);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-soft {
      border: 1px solid #BAE6FD;
      background: #F0F9FF;
      color: #0369A1;
      border-radius: 14px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .input-field {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid #CBD5E1;
      background: #F8FAFC;
      font-family: inherit;
      font-size: 13.5px;
      color: #0F172A;
      outline: none;
    }

    .input-field:focus {
      border-color: #0284C7;
      background: #FFFFFF;
    }

    /* Checklist */
    .task-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 18px;
      border: 1px solid #E2E8F0;
      background: #FFFFFF;
      margin-bottom: 9px;
      cursor: pointer;
      text-align: left;
    }

    .task-item.done {
      background: #F0FDFA;
      border-color: #99F6E4;
    }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #FFFFFF;
    }

    .task-item.done .check-circle {
      background: #0D9488;
      border-color: #0D9488;
    }

    /* Water Gauge */
    .water-vessel {
      width: 142px;
      height: 142px;
      border-radius: 50%;
      border: 4px solid #E0F2FE;
      background: #F0F9FF;
      position: relative;
      overflow: hidden;
      margin: 6px auto 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 12px rgba(2, 132, 199, 0.08);
    }

    .water-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #14B8A6 0%, #0284C7 100%);
      transition: height 0.6s ease;
    }

    /* Notice Banners */
    .notice-amber {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #78350F;
      border-radius: 16px;
      padding: 11px 13px;
      font-size: 11.5px;
      line-height: 1.45;
      display: flex;
      gap: 9px;
      margin-bottom: 14px;
    }

    .notice-blue {
      background: #F0F9FF;
      border: 1px solid #BAE6FD;
      color: #0C4A6E;
      border-radius: 16px;
      padding: 11px 13px;
      font-size: 11.5px;
      line-height: 1.45;
      display: flex;
      gap: 9px;
      margin-bottom: 14px;
    }

    /* Chat Bubbles */
    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 360px;
      overflow-y: auto;
      padding: 4px 2px 10px;
    }

    .bubble {
      max-width: 84%;
      padding: 11px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .bubble-bot {
      align-self: flex-start;
      background: #FFFFFF;
      border: 1px solid #BAE6FD;
      color: #1E293B;
      border-bottom-left-radius: 6px;
    }

    .bubble-user {
      align-self: flex-end;
      background: linear-gradient(90deg, #0284C7, #0D9488);
      color: #FFFFFF;
      border-bottom-right-radius: 6px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      box-shadow: 0 -6px 22px rgba(15, 23, 42, 0.05);
    }

    @media (min-width: 520px) {
      .bottom-nav {
        position: absolute;
      }
    }

    .nav-btn {
      background: none;
      border: none;
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #94A3B8;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn.active {
      background: #F0F9FF;
      color: #0D9488;
    }

    .pill-chip {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid #BAE6FD;
      background: #FFFFFF;
      color: #0369A1;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill-chip.selected {
      background: #0D9488;
      border-color: #0D9488;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="phone-shell">
      <header id="app-header" class="top-header"></header>
      <main id="app-main" class="main-scroll"></main>
      <nav id="app-nav" class="bottom-nav" aria-label="Bottom Navigation"></nav>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'aura_health_ai_single_v1';

      const DEFAULT_STATE = {
        profile: {
          name: 'Aarav',
          dailyWaterGoalMl: 2500,
          sleepGoalHours: 8,
          remindersEnabled: false,
          aiApiEndpoint: ''
        },
        morningTasks: [
          { id: 'm1', title: 'Warm Hydration (300 ml water)', duration: '2 min', category: 'Hydration', completed: true },
          { id: 'm2', title: '4-7-8 Mindful Breathing', duration: '5 min', category: 'Breathwork', completed: false },
          { id: 'm3', title: 'Morning Sunlight & Mobility Stretch', duration: '10 min', category: 'Movement', completed: false },
          { id: 'm4', title: 'Balanced Protein Breakfast', duration: '15 min', category: 'Nutrition', completed: false }
        ],
        afternoonTasks: [
          { id: 'a1', title: 'Posture Check & Shoulder Release', duration: '3 min', category: 'Mobility', completed: false },
          { id: 'a2', title: '20-20-20 Eye Relief Break', duration: '2 min', category: 'Recovery', completed: false },
          { id: 'a3', title: 'Midday Water & Electrolyte Refill', duration: '2 min', category: 'Hydration', completed: false },
          { id: 'a4', title: '10-Minute Brisk Walk', duration: '10 min', category: 'Activity', completed: false }
        ],
        waterEntries: [
          { id: 'w1', amountMl: 300, time: '07:30 AM' },
          { id: 'w2', amountMl: 500, time: '10:15 AM' }
        ],
        sleepLogs: [
          { id: 's1', dateLabel: 'Mon', bedtime: '23:00', wakeTime: '06:30', hours: 7.5, quality: 4 },
          { id: 's2', dateLabel: 'Tue', bedtime: '22:45', wakeTime: '06:45', hours: 8.0, quality: 5 },
          { id: 's3', dateLabel: 'Wed', bedtime: '23:30', wakeTime: '06:30', hours: 7.0, quality: 3 },
          { id: 's4', dateLabel: 'Thu', bedtime: '22:30', wakeTime: '06:30', hours: 8.0, quality: 4 },
          { id: 's5', dateLabel: 'Fri', bedtime: '23:15', wakeTime: '06:45', hours: 7.5, quality: 4 },
          { id: 's6', dateLabel: 'Sat', bedtime: '23:45', wakeTime: '07:45', hours: 8.0, quality: 5 }
        ],
        moodEntries: [
          {
            id: 'mo1',
            mood: 'Calm',
            score: 4,
            note: 'Morning breathwork helped keep focus steady.',
            tags: ['Focused', 'Rested'],
            timestamp: 'Today, 08:40 AM'
          }
        ]
      };

      let state = loadState();
      let activeScreen = 'home';
      let timerSeconds = 120;
      let timerRunning = false;
      let timerInterval = null;

      let selectedMood = { level: 'Calm', score: 4 };
      let selectedMoodTags = ['Focused'];
      let sleepQualityDraft = 4;
      let chatMessages = [];

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
          return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw));
        } catch (e) {
          return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function initChatIfNeeded() {
        if (chatMessages.length === 0) {
          const totalWater = state.waterEntries.reduce((s, w) => s + w.amountMl, 0);
          chatMessages.push({
            role: 'bot',
            text: `Hello ${state.profile.name}! I'm Aura AI. You've logged ${totalWater} ml of water today. Ask me about hydration pacing, morning breathwork, sleep hygiene, or afternoon resets.`,
            time: 'Now'
          });
        }
      }

      // Illustrations
      const HERO_SVG = `
        <svg viewBox="0 0 360 185" style="width:100%;height:172px;display:block;" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hBg" x1="0" y1="0" x2="360" y2="185" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.14"/>
              <stop offset="55%" stop-color="#14B8A6" stop-opacity="0.20"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
            </linearGradient>
            <linearGradient id="aCirc" x1="120" y1="25" x2="240" y2="150" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#0D9488"/>
            </linearGradient>
          </defs>
          <rect width="360" height="185" rx="22" fill="url(#hBg)"/>
          <path d="M0 138C65 114 125 158 195 136C258 116 305 132 360 112V185H0V138Z" fill="#0284C7" fill-opacity="0.16"/>
          <path d="M0 154C80 136 145 172 225 150C280 134 322 148 360 138V185H0V154Z" fill="#FFFFFF" fill-opacity="0.5"/>
          <circle cx="180" cy="90" r="66" fill="#14B8A6" fill-opacity="0.1" class="anim-aura"/>
          <circle cx="180" cy="90" r="48" fill="#0284C7" fill-opacity="0.13"/>
          <circle cx="180" cy="90" r="33" fill="url(#aCirc)" fill-opacity="0.92"/>
          <path d="M114 132C96 114 94 90 110 72C124 90 126 112 114 132Z" fill="#0D9488" fill-opacity="0.65"/>
          <path d="M92 136C74 126 68 107 78 91C94 101 100 119 92 136Z" fill="#38BDF8" fill-opacity="0.65"/>
          <path d="M246 132C264 114 266 90 250 72C236 90 234 112 246 132Z" fill="#0D9488" fill-opacity="0.65"/>
          <path d="M268 136C286 126 292 107 282 91C266 101 260 119 268 136Z" fill="#38BDF8" fill-opacity="0.65"/>
          <g class="anim-float">
            <circle cx="180" cy="68" r="10" fill="#FFFFFF"/>
            <path d="M161 105C161 90 169 82 180 82C191 82 199 90 199 105C199 110 195 113 189 113H171C165 113 161 110 161 105Z" fill="#FFFFFF"/>
            <path d="M155 113C163 109 171 111 180 114C189 111 197 109 205 113" stroke="#CCFBF1" stroke-width="3.5" stroke-linecap="round"/>
          </g>
          <path d="M40 50H66L73 36L82 62L90 44L96 50H118" stroke="#0284C7" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M292 40L295 48L303 51L295 54L292 62L289 54L281 51L289 48L292 40Z" fill="#0D9488" fill-opacity="0.72"/>
          <circle cx="268" cy="34" r="3" fill="#0284C7" fill-opacity="0.55"/>
        </svg>`;

      function morningSvg(compact) {
        const cls = compact ? 'width:76px;height:52px;display:block;' : 'width:100%;height:130px;display:block;';
        return `<svg viewBox="0 0 180 110" style="${cls}" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="90" cy="56" r="34" fill="#FEF3C7" fill-opacity="0.55"/>
          <circle cx="90" cy="56" r="22" fill="#FBBF24"/>
          <path d="M90 12V22M52 28L59 35M128 28L121 35M36 56H46M134 56H144" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
          <path d="M10 88C45 68 85 74 118 84C142 91 160 80 172 74V104H10V88Z" fill="#0D9488" fill-opacity="0.24"/>
          <path d="M10 94C52 78 106 96 172 82V106H10V94Z" fill="#0284C7" fill-opacity="0.22"/>
        </svg>`;
      }

      function afternoonSvg(compact) {
        const cls = compact ? 'width:76px;height:52px;display:block;' : 'width:100%;height:130px;display:block;';
        return `<svg viewBox="0 0 180 110" style="${cls}" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="122" cy="40" r="24" fill="#BAE6FD" fill-opacity="0.75"/>
          <circle cx="122" cy="40" r="15" fill="#0284C7" fill-opacity="0.88"/>
          <rect x="44" y="34" width="46" height="18" rx="9" fill="#FFFFFF"/>

      const SCREEN_TITLES = {
        home: 'AURA HEALTH AI',

        water: 'Water Tracker',
        sleep: 'Sleep Tracker',

      function stopTimer() {

            <button class="header-pill pressable" data-nav="report">Weekly Report</button>

      function renderNav() {
        const nav = document.getElementById('app-nav');
        const items = [
          { id: 'home', label: 'Home', svg: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' },

          { id: 'sleep', label: 'Sleep', svg: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>' },
          { id: 'assistant', label: 'Aura AI', svg: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>' },

          `;
        }).join('');
      }

      function renderHome() {
        const totalWater = state.waterEntries.reduce((s, w) => s + w.amountMl, 0);
        const waterPct = Math.min(100, Math.round((totalWater / state.profile.dailyWaterGoalMl) * 100));
        const mDone = state.morningTasks.filter(t => t.completed).length;
        const mPct = state.morningTasks.length ? Math.round((mDone / state.morningTasks.length) * 100) : 0;
        const aDone = state.afternoonTasks.filter(t => t.completed).length;
        const aPct = state.afternoonTasks.length ? Math.round((aDone / state.afternoonTasks.length) * 100) : 0;
        const lastSleep = state.sleepLogs[state.sleepLogs.length - 1];
        const lastMood = state.moodEntries[0];

        const features = [
          { id: 'water', title: 'Water Tracker', sub: 'Hydration target', val: `${totalWater} / ${state.profile.dailyWaterGoalMl} ml`, color: '#0284C7', svg: '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>' },
          { id: 'sleep', title: 'Sleep Tracker', sub: 'Last logged rest', val: lastSleep ? `${lastSleep.hours} hrs` : 'Log tonight', color: '#4F46E5', svg: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>' },
          { id: 'mood', title: 'Mood Tracker', sub: 'Emotional check-in', val: lastMood ? lastMood.mood : 'Check in', color: '#0D9488', svg: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>' },
          { id: 'assistant', title: 'AI Assistant', sub: 'Guided wellness', val: 'Ask Aura AI', color: '#0891B2', svg: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>' },
          { id: 'report', title: 'Weekly Report', sub: 'Habit analytics', val: `${waterPct}% hydrated`, color: '#2563EB', svg: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>' },
          { id: 'profile', title: 'Profile & Settings', sub: 'Goals & integrations', val: escapeHtml(state.profile.name), color: '#334155', svg: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' }
        ];

        return `
          <div class="screen-anim">
            <section class="card hero-card">
              ${HERO_SVG}
              <div style="padding: 12px 4px 2px;">
                <span class="badge">● Daily Wellness Balance</span>
                <h2 class="h-title">Good day, ${escapeHtml(state.profile.name)}. Breathe &amp; thrive.</h2>
                <p class="sub-text">Stay aligned with gentle routines, mindful hydration, restorative sleep, and intelligent wellness guidance tailored to your pace.</p>
              </div>
            </section>

            <div class="section-head">
              <h3>Daily Guided Routines</h3>
              <span>Tap to open</span>
            </div>

            <button class="routine-card-morning pressable" data-nav="morning">
              <div style="flex:1;">
                <span style="display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,0.22);font-size:11px;font-weight:700;margin-bottom:6px;">☀ 1. Morning Routine</span>
                <div style="font-size:17px;font-weight:800;">Energize &amp; Center</div>
                <div style="font-size:11.5px;opacity:0.9;margin-top:2px;">Hydration, 4-7-8 breathwork &amp; sunlight stretch</div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
                  <div class="progress-track"><div class="progress-fill" style="width:${mPct}%"></div></div>
                  <span style="font-size:11px;font-weight:800;">${mDone}/${state.morningTasks.length}</span>
                </div>
              </div>
              <div class="mini-illus-box">${morningSvg(true)}</div>
            </button>

            <button class="routine-card-afternoon pressable" data-nav="afternoon">
              <div style="flex:1;">
                <span style="display:inline-block;padding:3px 9px;border-radius:999px;background:#CCFBF1;color:#0F766E;font-size:11px;font-weight:700;margin-bottom:6px;">⛅ 2. Afternoon Routine</span>
                <div style="font-size:17px;font-weight:800;color:#0F172A;">Midday Reset &amp; Focus</div>
                <div style="font-size:11.5px;color:#64748B;margin-top:2px;">Posture alignment, eye relief &amp; brisk recharge</div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
                  <div class="progress-track progress-track-light"><div class="progress-fill progress-fill-teal" style="width:${aPct}%"></div></div>
                  <span style="font-size:11px;font-weight:800;color:#0F766E;">${aDone}/${state.afternoonTasks.length}</span>
                </div>
              </div>
              <div class="mini-illus-box" style="background:#F0F9FF;border:1px solid #E0F2FE;">${afternoonSvg(true)}</div>
            </button>

            <div class="section-head">
              <h3>Health &amp; Wellness Suite</h3>
            </div>

            <div class="feature-grid">
              ${features.map(f => `
                <button class="feature-card pressable" data-nav="${f.id}">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div class="feature-icon-box" style="color:${f.color};">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${f.svg}</svg>
                    </div>
                    <span style="color:#94A3B8;font-size:16px;">›</span>
                  </div>
                  <div style="margin-top:12px;">
                    <div style="font-size:13.5px;font-weight:800;color:#0F172A;">${f.title}</div>
                    <div style="font-size:11px;color:#64748B;margin-top:2px;">${f.sub}</div>
                    <div style="font-size:12px;font-weight:800;color:#0284C7;margin-top:6px;">${f.val}</div>
                  </div>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      function formatClock(sec) {
        const m = Math.floor(sec / 60);
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      }

      function getBreathCue(sec) {
        const mod = sec % 12;
        if (mod >= 8) return 'Inhale Deeply...';
        if (mod >= 4) return 'Hold Softly...';
        return 'Exhale Slowly...';
      }

      function renderRoutine(mode) {
        const isMorning = mode === 'morning';
        const tasks = isMorning ? state.morningTasks : state.afternoonTasks;
        const done = tasks.filter(t => t.completed).length;
        const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;

        return `
          <div class="screen-anim">
            <div class="card" style="background:linear-gradient(155deg, ${isMorning ? '#F0F9FF' : '#F0FDFA'} 0%, #FFFFFF 100%);">
              ${isMorning ? morningSvg(false) : afternoonSvg(false)}
              <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;">
                <div>
                  <div style="font-size:11px;font-weight:800;color:#0D9488;text-transform:uppercase;">${isMorning ? 'Start Strong' : 'Midday Recharge'}</div>
                  <h2 style="margin:2px 0 0;font-size:19px;font-weight:800;">${isMorning ? 'Morning Wellness Ritual' : 'Afternoon Reset Ritual'}</h2>
                </div>
                <span style="font-size:18px;font-weight:800;color:#0284C7;">${pct}%</span>
              </div>
              <div class="progress-track progress-track-light" style="height:9px;margin-top:10px;">
                <div class="progress-fill progress-fill-teal" style="width:${pct}%"></div>
              </div>
            </div>

            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <div style="font-size:14px;font-weight:800;">${isMorning ? 'Guided Breath Pacer' : '2-Min Desk Recovery Timer'}</div>
                  <div id="timer-phase" style="font-size:11.5px;color:#64748B;margin-top:2px;">${timerRunning ? getBreathCue(timerSeconds) : 'Tap start for a calming reset'}</div>
                </div>
                <div id="timer-clock" style="font-size:22px;font-weight:800;color:#0284C7;font-variant-numeric:tabular-nums;">${formatClock(timerSeconds)}</div>
              </div>
              <div style="display:flex;gap:8px;margin-top:12px;">
                <button id="btn-timer-toggle" class="btn-primary pressable" style="flex:1;">${timerRunning ? 'Pause Session' : 'Start 2-Min Session'}</button>
                <button id="btn-timer-reset" class="btn-soft pressable">Reset</button>
              </div>
            </div>

            <div class="section-head">
              <h3>Step-by-Step Checklist (${done}/${tasks.length})</h3>
            </div>

            ${tasks.map(t => `
              <button class="task-item pressable ${t.completed ? 'done' : ''}" data-toggle-task="${mode}:${t.id}">
                <span class="check-circle">${t.completed ? '✓' : ''}</span>
                <div style="flex:1;">
                  <div style="font-size:13.5px;font-weight:700;${t.completed ? 'text-decoration:line-through;color:#94A3B8;' : ''}">${escapeHtml(t.title)}</div>
                  <div style="font-size:11px;color:#64748B;margin-top:2px;">⏱ ${escapeHtml(t.duration)} • <span style="color:#0F766E;font-weight:700;">${escapeHtml(t.category)}</span></div>
                </div>
              </button>
            `).join('')}

            <form id="form-add-task" data-mode="${mode}" style="display:flex;gap:8px;margin-top:10px;">
              <input id="input-new-task" class="input-field" placeholder="Add custom ${mode} habit..." required />
              <button type="submit" class="btn-primary pressable" style="width:auto;padding:0 18px;">+ Add</button>
            </form>
          </div>
        `;
      }

      function renderWater() {
        const total = state.waterEntries.reduce((s, w) => s + w.amountMl, 0);
        const goal = state.profile.dailyWaterGoalMl;
        const pct = Math.min(100, Math.round((total / goal) * 100));

        return `
          <div class="screen-anim">
            <div class="card" style="text-align:center;">
              <div class="water-vessel">
                <div class="water-fill" style="height:${pct}%"></div>
                <div style="position:relative;z-index:2;font-size:24px;font-weight:800;color:${pct > 45 ? '#FFFFFF' : '#0F172A'};">${pct}%</div>
              </div>
              <div style="font-size:20px;font-weight:800;">${total} <span style="font-size:13px;color:#64748B;font-weight:600;">/ ${goal} ml</span></div>
              <p class="sub-text" style="margin-top:4px;">${total >= goal ? 'Daily hydration goal achieved!' : `${goal - total} ml remaining to reach your daily target`}</p>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;">
                <button class="btn-soft pressable" data-add-water="250">+250 ml</button>
                <button class="btn-soft pressable" data-add-water="350">+350 ml</button>
                <button class="btn-soft pressable" data-add-water="500">+500 ml</button>
              </div>
            </div>

            <div class="notice-blue">
              <span>🔔</span>

            </div>

            <div class="section-head"><h3>Today's Hydration Log</h3></div>
            ${state.waterEntries.length === 0 ? '<p class="sub-text">No intake logged yet today.</p>' : state.waterEntries.map(w => `
              <div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <div style="font-size:14px;font-weight:800;color:#0369A1;">💧 +${w.amountMl} ml</div>
                  <div style="font-size:11px;color:#64748B;">${escapeHtml(w.time)}</div>
                </div>
                <button class="btn-soft pressable" style="background:#FFF1F2;border-color:#FECDD3;color:#BE123C;padding:6px 10px;" data-del-water="${w.id}">Delete</button>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderSleep() {
        const avg = state.sleepLogs.length ? (state.sleepLogs.reduce((s, l) => s + l.hours, 0) / state.sleepLogs.length).toFixed(1) : '0.0';
        const recent = state.sleepLogs.slice(-7);

        return `
          <div class="screen-anim">
            <div class="card" style="background:linear-gradient(155deg,#F0F9FF 0%,#FFFFFF 100%);">
              ${SLEEP_SVG}
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <div style="font-size:11px;font-weight:800;color:#0369A1;text-transform:uppercase;">Weekly Average</div>
                  <div style="font-size:22px;font-weight:800;">${avg} hrs <span style="font-size:12px;color:#64748B;">/ ${state.profile.sleepGoalHours}h goal</span></div>
                </div>
                <span style="font-size:24px;">🌙</span>
              </div>
            </div>

            <div class="notice-amber">
              <span>⌚</span>
              <div><strong>Manual Sleep Log Mode:</strong> Automatic sleep stages, SpO2, and overnight heart rate require <strong>Android Health Connect</strong> or a wearable API integration.</div>
            </div>

            <form id="form-sleep" class="card">
              <div style="font-size:14px;font-weight:800;margin-bottom:10px;">Log Last Night's Sleep</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
                <div>
                  <label style="font-size:11px;font-weight:700;color:#64748B;display:block;margin-bottom:4px;">Bedtime</label>
                  <input id="sleep-bed" type="time" class="input-field" value="22:45" required />
                </div>
                <div>
                  <label style="font-size:11px;font-weight:700;color:#64748B;display:block;margin-bottom:4px;">Wake Time</label>
                  <input id="sleep-wake" type="time" class="input-field" value="06:45" required />
                </div>
              </div>
              <label style="font-size:11px;font-weight:700;color:#64748B;display:block;margin-bottom:6px;">Rest Quality (${sleepQualityDraft}/5)</label>
              <div style="display:flex;gap:6px;margin-bottom:14px;">
                ${[1,2,3,4,5].map(q => `
                  <button type="button" class="pill-chip ${sleepQualityDraft === q ? 'selected' : ''}" style="flex:1;padding:8px 0;" data-sleep-q="${q}">${q}★</button>
                `).join('')}
              </div>
              <button type="submit" class="btn-primary pressable">Save Sleep Entry</button>
            </form>

            <div class="card">
              <div style="font-size:14px;font-weight:800;margin-bottom:12px;">Recent Sleep Duration</div>
              <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:110px;">
                ${recent.map(l => {
                  const h = Math.min(100, Math.round((l.hours / 10) * 100));
                  return `
                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
                      <span style="font-size:10px;font-weight:700;color:#0369A1;">${l.hours}h</span>
                      <div style="width:100%;height:68px;background:#F0F9FF;border-radius:10px 10px 0 0;display:flex;align-items:flex-end;overflow:hidden;">
                        <div style="width:100%;height:${h}%;background:linear-gradient(180deg,#14B8A6,#0284C7);border-radius:10px 10px 0 0;"></div>
                      </div>
                      <span style="font-size:10px;font-weight:600;color:#64748B;">${escapeHtml(l.dateLabel)}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      function renderMood() {
        const moods = [
          { level: 'Radiant', score: 5, emoji: '✨' },
          { level: 'Calm', score: 4, emoji: '😌' },
          { level: 'Neutral', score: 3, emoji: '😐' },
          { level: 'Tired', score: 2, emoji: '😴' },
          { level: 'Stressed', score: 1, emoji: '🌧️' }
        ];
        const tags = ['Rested', 'Focused', 'Grateful', 'Busy', 'Anxious', 'Energized'];

        return `
          <div class="screen-anim">
            <form id="form-mood" class="card">
              <div style="font-size:15px;font-weight:800;">How are you feeling right now?</div>
              <p class="sub-text" style="margin-bottom:12px;">Emotional awareness supports daily resilience</p>

              <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px;">
                ${moods.map(m => {
                  const active = selectedMood.level === m.level;
                  return `
                    <button type="button" data-mood-pick="${m.level}:${m.score}" style="padding:10px 4px;border-radius:16px;border:1px solid ${active ? '#0D9488' : '#E2E8F0'};background:${active ? 'linear-gradient(135deg,#0284C7,#0D9488)' : '#F8FAFC'};color:${active ? '#FFFFFF' : '#334155'};cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;">
                      <span style="font-size:18px;">${m.emoji}</span>
                      <span style="font-size:10px;font-weight:700;">${m.level}</span>
                    </button>
                  `;
                }).join('')}
              </div>

              <div style="font-size:11px;font-weight:700;color:#64748B;margin-bottom:6px;">Context Tags</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
                ${tags.map(t => `
                  <button type="button" class="pill-chip ${selectedMoodTags.includes(t) ? 'selected' : ''}" data-mood-tag="${t}">${t}</button>
                `).join('')}

              <textarea id="mood-note" rows="2" class="input-field" placeholder="Add a short reflection or gratitude note..." style="margin-bottom:12px;"></textarea>
              <button type="submit" class="btn-primary pressable">Log Mood Check-In</button>

            <div class="section-head"><h3>Recent Check-Ins</h3></div>
            ${state.moodEntries.map(m => `
              <div class="card" style="padding:13px 14px;margin-bottom:9px;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <strong style="font-size:13.5px;color:#0F766E;">✨ ${escapeHtml(m.mood)}</strong>
                  <span style="font-size:11px;color:#94A3B8;">${escapeHtml(m.timestamp)}</span>
                </div>
                <p class="sub-text" style="margin-top:4px;color:#334155;">${escapeHtml(m.note)}</p>
                <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;">
                  ${m.tags.map(t => `<span style="padding:2px 8px;border-radius:999px;background:#F0F9FF;color:#0369A1;font-size:10px;font-weight:700;">${escapeHtml(t)}</span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function generateBotReply(q) {
        const lower = q.toLowerCase();
        const totalWater = state.waterEntries.reduce((s, w) => s + w.amountMl, 0);
        if (lower.includes('water') || lower.includes('hydrat')) {
          const rem = Math.max(0, state.profile.dailyWaterGoalMl - totalWater);
          return rem === 0
            ? `Great consistency! You've met your ${state.profile.dailyWaterGoalMl} ml goal today.`
            : `You are at ${totalWater} ml today (${rem} ml left). Try sipping 250 ml every 90 minutes.`;
        }
        if (lower.includes('sleep') || lower.includes('tired')) {
          return `For deeper sleep, dim screens 45 minutes before bed and keep your room cool. Note: Automatic sleep-stage analysis requires connecting Android Health Connect.`;
        }
        if (lower.includes('stress') || lower.includes('breath')) {
          return `Try the 4-7-8 breathing timer inside Morning Routine: inhale 4s, hold 7s, exhale 8s to calm your nervous system.`;
        }
        return `Balanced wellness tip: Pair your Afternoon Routine posture break with 250 ml of water. For medical advice or symptoms, always consult a licensed doctor.`;
      }

      function renderAssistant() {
        initChatIfNeeded();
        const hasApi = Boolean(state.profile.aiApiEndpoint.trim());

        return `
          <div class="screen-anim">
            <div class="notice-blue" style="margin-bottom:8px;justify-content:space-between;align-items:center;">
              <span>🤖 <strong>${hasApi ? 'Custom API Endpoint Linked' : 'Offline Guided Wellness Mode'}</strong></span>
              <span style="font-weight:800;">${hasApi ? 'Ready' : 'API Optional'}</span>
            </div>
            <div class="notice-amber" style="background:#F1F5F9;border-color:#CBD5E1;color:#475569;">
              <span>🛡️</span>
              <div>Wellness support only — not medical advice. Live generative AI requires connecting a backend API in Profile &amp; Settings.</div>
            </div>

            <div class="card" style="padding:12px;">
              <div id="chat-feed" class="chat-box">
                ${chatMessages.map(m => `
                  <div class="bubble ${m.role === 'user' ? 'bubble-user' : 'bubble-bot'}">
                    ${m.role === 'bot' ? '<div style="font-size:10px;font-weight:800;color:#0D9488;margin-bottom:3px;">✨ AURA AI</div>' : ''}
                    <div>${escapeHtml(m.text)}</div>
                    <div style="font-size:9.5px;opacity:0.7;margin-top:4px;text-align:${m.role === 'user' ? 'right' : 'left'};">${escapeHtml(m.time)}</div>
                  </div>
                `).join('')}
              </div>

              <div style="display:flex;gap:6px;overflow-x:auto;padding:8px 0;">
                <button class="pill-chip" data-quick-ask="How is my hydration today?">Hydration status</button>
                <button class="pill-chip" data-quick-ask="Help me wind down for sleep">Sleep tip</button>
                <button class="pill-chip" data-quick-ask="Quick stress relief tip">Stress relief</button>
              </div>

              <form id="form-chat" style="display:flex;gap:8px;margin-top:4px;">
                <input id="chat-input" class="input-field" placeholder="Ask Aura AI about wellness..." required />
                <button type="submit" class="btn-primary pressable" style="width:auto;padding:0 16px;">Send</button>
              </form>
            </div>
          </div>
        `;
      }

      function renderReport() {
        const totalTasks = state.morningTasks.length + state.afternoonTasks.length;
        const doneTasks = state.morningTasks.filter(t => t.completed).length + state.afternoonTasks.filter(t => t.completed).length;
        const rPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

        const totalWater = state.waterEntries.reduce((s, w) => s + w.amountMl, 0);
        const wPct = Math.min(100, Math.round((totalWater / state.profile.dailyWaterGoalMl) * 100));

        const avgSleep = state.sleepLogs.length ? state.sleepLogs.reduce((s, l) => s + l.hours, 0) / state.sleepLogs.length : 0;
        const sPct = Math.min(100, Math.round((avgSleep / state.profile.sleepGoalHours) * 100));

        const overall = Math.round((rPct + wPct + sPct) / 3);
        const avgMood = state.moodEntries.length ? (state.moodEntries.reduce((s, m) => s + m.score, 0) / state.moodEntries.length).toFixed(1) : '—';

        const bars = [
          { label: 'Daily Routines (Today)', pct: rPct, detail: `${doneTasks}/${totalTasks} habits` },
          { label: 'Hydration Goal (Today)', pct: wPct, detail: `${totalWater} / ${state.profile.dailyWaterGoalMl} ml` },
          { label: 'Sleep Consistency (7-Day Avg)', pct: sPct, detail: `${avgSleep.toFixed(1)}h avg` }
        ];

        return `
          <div class="screen-anim">
            <div class="card" style="background:linear-gradient(135deg,#0284C7,#0D9488);color:#FFFFFF;border:none;box-shadow:var(--shadow-soft);">
              <div style="font-size:11px;font-weight:700;opacity:0.9;text-transform:uppercase;">Weekly Consistency</div>
              <div style="font-size:34px;font-weight:800;margin:4px 0;">${overall}%</div>
              <div style="font-size:12px;opacity:0.9;">Calculated directly from your logged routines, hydration, and sleep entries.</div>
            </div>

            <div class="card">
              <div style="font-size:14px;font-weight:800;margin-bottom:14px;">Pillar Breakdown</div>
              ${bars.map(b => `
                <div style="margin-bottom:14px;">
                  <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;">
                    <span style="font-weight:700;color:#334155;">${b.label}</span>
                    <span style="font-weight:800;color:#0F766E;">${b.detail}</span>
                  </div>
                  <div class="progress-track progress-track-light" style="height:9px;">
                    <div class="progress-fill progress-fill-teal" style="width:${b.pct}%"></div>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="feature-grid" style="margin-bottom:14px;">
              <div class="card" style="margin:0;background:#F0FDFA;border-color:#CCFBF1;">
                <div style="font-size:11px;font-weight:700;color:#0F766E;">Avg Mood Score</div>
                <div style="font-size:22px;font-weight:800;margin-top:4px;">${avgMood} / 5</div>
                <div style="font-size:11px;color:#64748B;">${state.moodEntries.length} check-ins</div>
              </div>
              <div class="card" style="margin:0;background:#F0F9FF;border-color:#BAE6FD;">
                <div style="font-size:11px;font-weight:700;color:#0369A1;">Sleep Logged</div>
                <div style="font-size:22px;font-weight:800;margin-top:4px;">${state.sleepLogs.length} nights</div>
                <div style="font-size:11px;color:#64748B;">Manual log mode</div>
              </div>
            </div>
          </div>
        `;
      }

      function renderProfile() {
        return `
          <div class="screen-anim">
            <div class="card" style="display:flex;align-items:center;gap:14px;">
              <div class="brand-logo" style="width:52px;height:52px;border-radius:16px;font-size:22px;color:#fff;font-weight:800;">
                ${escapeHtml(state.profile.name.charAt(0).toUpperCase() || 'A')}
              </div>
              <div>
                <div style="font-size:17px;font-weight:800;">${escapeHtml(state.profile.name)}</div>
                <div style="font-size:12px;color:#64748B;">AURA HEALTH AI Member</div>
              </div>
            </div>

            <form id="form-profile" class="card">
              <div style="font-size:14px;font-weight:800;margin-bottom:12px;">Personal Wellness Goals</div>
              <label style="font-size:11px;font-weight:700;color:#64748B;display:block;margin-bottom:4px;">Display Name</label>
              <input id="prof-name" class="input-field" value="${escapeHtml(state.profile.name)}" style="margin-bottom:10px;" required />

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
                <div>
                  <label style="font-size:11px;font-weight:700;color:#64748B;display:block;margin-bottom:4px;">Water Goal (ml)</label>
                  <input id="prof-water" type="number" min="1000" max="5000" step="100" class="input-field" value="${state.profile.dailyWaterGoalMl}" />
                </div>
                <div>
                  <label style="font-size:11px;font-weight:700;color:#64748B;display:block;margin-bottom:4px;">Sleep Goal (hrs)</label>
                  <input id="prof-sleep" type="number" min="5" max="11" step="0.5" class="input-field" value="${state.profile.sleepGoalHours}" />
                </div>
              </div>

              <label style="font-size:11px;font-weight:700;color:#64748B;display:block;margin-bottom:4px;">Optional AI Backend API Endpoint</label>
              <input id="prof-api" type="url" class="input-field" placeholder="https://your-backend.example.com/aura-ai" value="${escapeHtml(state.profile.aiApiEndpoint)}" style="margin-bottom:12px;" />

              <label style="display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:14px;cursor:pointer;">
                <span>🔔 Hydration &amp; Routine Reminders</span>
                <input id="prof-rem" type="checkbox" ${state.profile.remindersEnabled ? 'checked' : ''} style="width:18px;height:18px;accent-color:#0D9488;" />
              </label>

              <button id="btn-save-prof" type="submit" class="btn-primary pressable">Save Preferences</button>
            </form>

            <div class="card">
              <div style="font-size:14px;font-weight:800;margin-bottom:10px;">Device &amp; API Integrations</div>
              ${[
                { name: 'Android Health Connect (Sleep / HR)', st: 'Integration Required' },
                { name: 'Cloud Generative AI Backend', st: state.profile.aiApiEndpoint ? 'URL Saved' : 'Offline Guided Mode' },
                { name: 'Native Local Notifications', st: 'Requires Capacitor Plugin' }
              ].map(i => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:7px;font-size:11.5px;">
                  <span style="font-weight:600;color:#334155;">${i.name}</span>
                  <span style="font-weight:700;font-size:10px;padding:3px 8px;border-radius:999px;background:#FFFFFF;border:1px solid #CBD5E1;">${i.st}</span>
                </div>
              `).join('')}
            </div>

            <button id="btn-reset-all" class="btn-soft pressable" style="width:100%;background:#FFF1F2;border-color:#FECDD3;color:#BE123C;padding:12px;">Reset App Data to Defaults</button>
          </div>
        `;
      }

      function renderScreen() {
        const main = document.getElementById('app-main');
        switch (activeScreen) {
          case 'home': main.innerHTML = renderHome(); break;
          case 'morning': main.innerHTML = renderRoutine('morning'); break;
          case 'afternoon': main.innerHTML = renderRoutine('afternoon'); break;
          case 'water': main.innerHTML = renderWater(); break;
          case 'sleep': main.innerHTML = renderSleep(); break;
          case 'mood': main.innerHTML = renderMood(); break;
          case 'assistant': main.innerHTML = renderAssistant(); break;
          case 'report': main.innerHTML = renderReport(); break;
          case 'profile': main.innerHTML = renderProfile(); break;
        }
        if (activeScreen === 'assistant') {
          const feed = document.getElementById('chat-feed');
          if (feed) feed.scrollTop = feed.scrollHeight;
        }
      }

      function renderAll() {
        renderHeader();
        renderScreen();
        renderNav();
      }

      // Global Delegated Event Listeners
      document.addEventListener('click', function (e) {
        const navEl = e.target.closest('[data-nav]');
        if (navEl) {
          navigate(navEl.getAttribute('data-nav'));
          return;
        }

        const taskEl = e.target.closest('[data-toggle-task]');
        if (taskEl) {
          const [mode, id] = taskEl.getAttribute('data-toggle-task').split(':');
          const key = mode === 'morning' ? 'morningTasks' : 'afternoonTasks';
          state[key] = state[key].map(t => t.id === id ? Object.assign({}, t, { completed: !t.completed }) : t);
          saveState();
          renderScreen();
          return;
        }

        if (e.target.id === 'btn-timer-toggle') {
          if (timerRunning) {
            stopTimer();
            renderScreen();
          } else {
            timerRunning = true;
            if (timerSeconds <= 0) timerSeconds = 120;
            renderScreen();
            timerInterval = setInterval(() => {
              timerSeconds--;
              const clock = document.getElementById('timer-clock');
              const phase = document.getElementById('timer-phase');
              if (timerSeconds <= 0) {
                timerSeconds = 0;
                stopTimer();
                renderScreen();
                return;
              }
              if (clock) clock.textContent = formatClock(timerSeconds);
              if (phase) phase.textContent = getBreathCue(timerSeconds);
            }, 1000);
          }
          return;
        }

        if (e.target.id === 'btn-timer-reset') {
          stopTimer();
          timerSeconds = 120;
          renderScreen();
          return;
        }

        const addWaterEl = e.target.closest('[data-add-water]');
        if (addWaterEl) {
          const amt = Number(addWaterEl.getAttribute('data-add-water'));
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          state.waterEntries.unshift({ id: 'w-' + Date.now(), amountMl: amt, time });
          saveState();
          renderScreen();
          return;
        }

        const delWaterEl = e.target.closest('[data-del-water]');
        if (delWaterEl) {
          const id = delWaterEl.getAttribute('data-del-water');
          state.waterEntries = state.waterEntries.filter(w => w.id !== id);
          saveState();
          renderScreen();
          return;
        }

        const sleepQEl = e.target.closest('[data-sleep-q]');
        if (sleepQEl) {
          sleepQualityDraft = Number(sleepQEl.getAttribute('data-sleep-q'));
          renderScreen();
          return;
        }

        const moodPickEl = e.target.closest('[data-mood-pick]');
        if (moodPickEl) {
          const [level, score] = moodPickEl.getAttribute('data-mood-pick').split(':');
          selectedMood = { level, score: Number(score) };
          renderScreen();
          return;
        }

        const moodTagEl = e.target.closest('[data-mood-tag]');
        if (moodTagEl) {
          const tag = moodTagEl.getAttribute('data-mood-tag');
          if (selectedMoodTags.includes(tag)) {
            selectedMoodTags = selectedMoodTags.filter(t => t !== tag);
          } else {
            selectedMoodTags.push(tag);
          }
          renderScreen();
          return;
        }

        const quickAskEl = e.target.closest('[data-quick-ask]');
        if (quickAskEl) {
          sendChat(quickAskEl.getAttribute('data-quick-ask'));
          return;
        }

        if (e.target.id === 'btn-reset-all') {
          localStorage.removeItem(STORAGE_KEY);
          state = JSON.parse(JSON.stringify(DEFAULT_STATE));
          chatMessages = [];
          renderAll();
          return;
        }
      });

      function sendChat(text) {
        const clean = text.trim();
        if (!clean) return;
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        chatMessages.push({ role: 'user', text: clean, time: now });
        const hasApi = Boolean(state.profile.aiApiEndpoint.trim());
        const reply = hasApi
          ? `[API Linked: ${state.profile.aiApiEndpoint}] Guided preview: ${generateBotReply(clean)}`
          : generateBotReply(clean);
        chatMessages.push({ role: 'bot', text: reply, time: now });
        renderScreen();
      }

      document.addEventListener('submit', function (e) {
        if (e.target.id === 'form-add-task') {
          e.preventDefault();
          const mode = e.target.getAttribute('data-mode');
          const input = document.getElementById('input-new-task');
          const title = input.value.trim();
          if (!title) return;
          const key = mode === 'morning' ? 'morningTasks' : 'afternoonTasks';
          state[key].push({ id: mode + '-' + Date.now(), title, duration: '5 min', category: 'Personal', completed: false });
          saveState();
          renderScreen();
          return;
        }

        if (e.target.id === 'form-sleep') {
          e.preventDefault();
          const bed = document.getElementById('sleep-bed').value;
          const wake = document.getElementById('sleep-wake').value;
          const [bh, bm] = bed.split(':').map(Number);
          const [wh, wm] = wake.split(':').map(Number);
          let start = bh * 60 + bm;
          let end = wh * 60 + wm;
          if (end <= start) end += 1440;
          const hours = Number(((end - start) / 60).toFixed(1));
          const dayLabel = new Date().toLocaleDateString('en-US', { weekday: 'short' });
          state.sleepLogs.push({ id: 's-' + Date.now(), dateLabel: dayLabel, bedtime: bed, wakeTime: wake, hours, quality: sleepQualityDraft });
          saveState();
          renderScreen();
          return;
        }

        if (e.target.id === 'form-mood') {
          e.preventDefault();
          const note = document.getElementById('mood-note').value.trim() || 'Mindful check-in logged.';
          const timestamp = 'Today, ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          state.moodEntries.unshift({
            id: 'mo-' + Date.now(),
            mood: selectedMood.level,
            score: selectedMood.score,
            note,
            tags: selectedMoodTags.slice(),
            timestamp
          });
          saveState();
          renderScreen();
          return;
        }

        if (e.target.id === 'form-chat') {
          e.preventDefault();
          const input = document.getElementById('chat-input');
          sendChat(input.value);
          return;
        }

        if (e.target.id === 'form-profile') {
          e.preventDefault();
          state.profile.name = document.getElementById('prof-name').value.trim() || 'Aarav';
          state.profile.dailyWaterGoalMl = Number(document.getElementById('prof-water').value) || 2500;
          state.profile.sleepGoalHours = Number(document.getElementById('prof-sleep').value) || 8;
          state.profile.aiApiEndpoint = document.getElementById('prof-api').value.trim();
          state.profile.remindersEnabled = document.getElementById('prof-rem').checked;
          saveState();
          const btn = document.getElementById('btn-save-prof');
          if (btn) btn.textContent = 'Preferences Saved ✓';
          setTimeout(() => renderHeader(), 300);
          return;
        }
      });

      renderAll();
    })();
  </script>
</body>
</html>
